services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      CLOUD_AUTH_ENABLED: ${CLOUD_AUTH_ENABLED:-0}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 bytes in .env}
      SQLITE_PATH: /data/recode.db
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-90}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - recode_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  recode_data:
